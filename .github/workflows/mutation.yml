name: Mutation

# Deliberately breaks one line of the product per job; the matching scenario test must then fail.
# A green job means the test caught the mutation; a red job means it survived or the mutation is invalid.
on:
  workflow_dispatch:
  # The repository default branch is not main, so manual dispatch is unavailable here; a push to main
  # touching the bench (or its cases) runs it instead.
  push:
    branches:
      - main
    paths:
      - tests/mutation_cases.json
      - tests/run_mutation.py
      - .github/workflows/mutation.yml

jobs:
  cases:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: ids
        run: echo "ids=$(python3 -c "import json;print(json.dumps([c['id'] for c in json.load(open('tests/mutation_cases.json'))]))")" >> "$GITHUB_OUTPUT"

  mutate:
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.cases.outputs.ids) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Identify Ghostty build cache
        id: ghostty_revision
        run: echo "revision=$(git rev-parse HEAD:ghostty)" >> "$GITHUB_OUTPUT"

      - name: Restore Ghostty build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            ghostty/.zig-cache
            ghostty/zig-out
            ~/.cache/zig
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty_revision.outputs.revision }}-${{ hashFiles('scripts/setup-linux*.sh') }}

      - name: Install Linux dependencies and build Ghostty
        run: ./scripts/setup-linux-dev.sh

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install headless UI test dependencies
        run: sudo apt-get install -y xvfb dbus-x11 openbox xdotool wmctrl x11-utils

      - name: Build unmutated binaries (must compile)
        run: cargo build --workspace --bins

      - name: Mutate, rebuild and require the test to fail
        run: python3 tests/run_mutation.py "${{ matrix.id }}"
